<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universal Headless Carousel - Minimal Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .demo-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .demo-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0f172a;
    }

    .demo-header p {
      color: #64748b;
      margin-top: 0.25rem;
      font-size: 0.95rem;
    }

    /* Headless Carousel Container */
    .carousel-container {
      width: 100%;
      max-width: 600px;
    }

    .carousel-viewport {
      display: flex;
      gap: 1rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      padding: 1rem 0;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .carousel-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Minimal Card Styling */
    .carousel-slide {
      scroll-snap-align: center;
      flex-shrink: 0;
      width: 80%;
      height: 220px;
      border-radius: 12px;
      background-color: #ffffff;
      border: 2px solid #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 600;
      color: #334155;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .carousel-slide[data-active="true"] {
      border-color: #2563eb;
      color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    /* Clean Controls */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 1rem;
    }

    button.btn-nav {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: white;
      color: #334155;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    button.btn-nav:hover {
      background: #f1f5f9;
    }

    .pagination {
      display: flex;
      gap: 0.5rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #cbd5e1;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .dot[data-active="true"] {
      background: #2563eb;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="demo-header">
    <h1>Universal Headless Carousel</h1>
    <p>Minimal & Headless: 100% UI Customization</p>
  </div>

  <div class="carousel-container">
    <div class="carousel-viewport" id="viewport" role="region" aria-roledescription="carousel" aria-label="Simple Carousel" tabindex="0">
      <div class="carousel-slide" data-index="0" data-active="true" role="group" aria-roledescription="slide">Slide 1</div>
      <div class="carousel-slide" data-index="1" data-active="false" role="group" aria-roledescription="slide">Slide 2</div>
      <div class="carousel-slide" data-index="2" data-active="false" role="group" aria-roledescription="slide">Slide 3</div>
      <div class="carousel-slide" data-index="3" data-active="false" role="group" aria-roledescription="slide">Slide 4</div>
    </div>

    <div class="controls">
      <button class="btn-nav" id="prev">Previous</button>
      <div class="pagination" id="pagination">
        <div class="dot" data-index="0" data-active="true"></div>
        <div class="dot" data-index="1" data-active="false"></div>
        <div class="dot" data-index="2" data-active="false"></div>
        <div class="dot" data-index="3" data-active="false"></div>
      </div>
      <button class="btn-nav" id="next">Next</button>
    </div>
  </div>

  <script>
    let activeIndex = 0;
    const count = 4;
    const viewport = document.getElementById('viewport');
    const slides = Array.from(document.querySelectorAll('.carousel-slide'));
    const dots = Array.from(document.querySelectorAll('.dot'));
    let isProgrammatic = false;
    let timer;

    function render(idx) {
      activeIndex = (idx + count) % count;
      slides.forEach((s, i) => s.setAttribute('data-active', i === activeIndex));
      dots.forEach((d, i) => d.setAttribute('data-active', i === activeIndex));
    }

    function scrollTo(idx) {
      render(idx);
      const target = slides[activeIndex];
      if (target) {
        isProgrammatic = true;
        clearTimeout(timer);
        const offset = target.offsetLeft - (viewport.clientWidth - target.clientWidth) / 2;
        viewport.scrollTo({ left: Math.max(0, offset), behavior: 'smooth' });
        timer = setTimeout(() => { isProgrammatic = false; }, 400);
      }
    }

    viewport.addEventListener('scroll', () => {
      if (isProgrammatic) return;
      const left = viewport.scrollLeft;
      let closest = activeIndex;
      let min = Infinity;
      slides.forEach((s, i) => {
        const offset = s.offsetLeft - (viewport.clientWidth - s.clientWidth) / 2;
        const d = Math.abs(offset - left);
        if (d < min) { min = d; closest = i; }
      });
      if (closest !== activeIndex) render(closest);
    });

    document.getElementById('prev').onclick = () => scrollTo(activeIndex - 1);
    document.getElementById('next').onclick = () => scrollTo(activeIndex + 1);
    dots.forEach(d => {
      d.onclick = () => scrollTo(parseInt(d.getAttribute('data-index'), 10));
    });
    viewport.onkeydown = (e) => {
      if (e.key === 'ArrowLeft') scrollTo(activeIndex - 1);
      if (e.key === 'ArrowRight') scrollTo(activeIndex + 1);
    };
  </script>
</body>
</html>
